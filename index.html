<!doctype html>
<html lang="en">
  <head>
    <title>Egor's page</title>

    <meta
      content=""
      name="theme-color"
    />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-1NXQYEWWMP"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-1NXQYEWWMP');
    </script>
    <!-- /Google tag (gtag.js) -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!--
      Paint something immediately: the app bundle needs ~1.5 s before React can
      render, and without this the screen stays white/blank until then.
    -->
    <style>
      /* Only on <html>: a background on <body> would paint over the starfield,
         which sits at z-index -10. */
      html {
        background: #000;
      }
      #boot {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 45%, #0b1a33 0%, #000 60%),
          #000;
      }
    </style>

    <!--
      The 3D hero's assets are only discovered once the bundle has parsed and
      react-three starts loading them (~1.6 s in). Preloading them here means
      they arrive in parallel with the JS instead of after it.
    -->
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/macbook/macbook.gltf"
    />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/macbook/macbook.bin"
    />
    <!-- crossorigin matters: three's ImageLoader requests these anonymously, and
         a preload without it lands in a different cache slot (double download). -->
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/macbook/textures/Glass_-_Heavy_Color_baseColor.jpeg"
    />
    <link
      rel="preload"
      as="fetch"
      crossorigin
      href="/macbook/textures/Aluminum_-_Anodized_Glossy_Grey_keyboard.jpg_baseColor.jpeg"
    />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:type"
      content="website"
    />
    <meta
      property="og:url"
      content="https://egor.xyz/"
    />
    <meta
      property="og:title"
      content="egor.xyz"
    />
    <meta
      property="og:description"
      content="Digest, Devkitty, Extensions"
    />
    <meta
      property="og:image"
      content="https://egor.xyz/bg.png"
    />

    <!-- Twitter -->
    <meta
      property="twitter:card"
      content="summary_large_image"
    />
    <meta
      property="twitter:url"
      content="https://egor.xyz/"
    />
    <meta
      property="twitter:title"
      content="egor.xyz"
    />
    <meta
      property="twitter:description"
      content="Digest, Devkitty, Extensions"
    />
    <meta
      property="twitter:image"
      content="https://egor.xyz/bg.png"
    />

    <!-- icons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/site.webmanifest"
    />
    <link
      rel="mask-icon"
      href="/safari-pinned-tab.svg"
      color="#ffffff"
    />
    <meta
      name="msapplication-TileColor"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      content="#ffffff"
    />
    <!-- /icons -->
  </head>
  <body>
    <div id="root">
      <div
        id="boot"
        aria-hidden="true"
      ></div>
    </div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
